        <!-- Page Header -->
        <section class="page-header">
            <h2>Academic Planner</h2>

            <p>
                Use this planner to organize your academic tasks.
            </p>
        </section>


        <!-- Task Planner -->
        <section class="planner">

            <div class="task-input">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter an academic task..."
                >

                <button id="addTaskBtn">
                    Add Task
                </button>

            </div>


            <div class="task-area">

                <h3>My Academic Tasks</h3>

                <ul id="taskList"></ul>

            </div>

        </section>
